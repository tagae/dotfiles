## ==[ History ]==

set-option -g history-limit 10000

## ==[ Key bindings ]==

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

## ==[ Status ]==

# tmux is the only chrome: the status bar doubles as the tab bar, at top.
set-option -g status-position top

# Window/pane numbering starts at 1 (0 is awkward to reach).
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

## ==[ Mouse ]==

set -g mouse off

## ==[ Titles ]==

# Use session name as title.
set -g set-titles on
set -g set-titles-string "#S"

## ==[ Status ]==

# Status bar: Catppuccin Mocha, matching WezTerm and Emacs. The
# terminal's own background (and transparency) shows through, so the bar
# blends into the window.
set-option -g status-style "bg=default,fg=#cdd6f4"

# No left/right sections: the window list is the whole bar.
set-option -g status-left ""
set-option -g status-right ""

## ==[ Windows ]==

# Window list entries: "1: <title>", truncated so several tabs fit; the
# current one is a solid block.
set-option -wg window-status-separator ""
set-option -wg window-status-format " #I: #{=/24/...:pane_title} "
set-option -wg window-status-current-format " #I: #{=/24/...:pane_title} "
set-option -wg window-status-style "fg=#a6adc8"
set-option -wg window-status-current-style "bg=#fab387,fg=#1e1e2e,bold"

# Windows with activity/bell. Agents ring the bell when they finish or
# need input, so those tabs stand out until visited.
set-option -wg window-status-activity-style "fg=#f38ba8"
set-option -wg window-status-bell-style "fg=#f38ba8,bold"

# Let the running program (fish, Claude Code, Codex, ...) drive the window
# name via its own terminal-title escape codes, instead of tmux guessing
# from the command name. This is what surfaces an agent's live status
# ("Working...", "Needs input", ...) directly in the window tab.
set-option -g allow-rename off
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{pane_title}"

# ==[ Local config ]==

if-shell "[ -f ~/.tmux-local.conf ]" 'source ~/.tmux-local.conf'
